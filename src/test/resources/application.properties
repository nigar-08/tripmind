spring.datasource.url=jdbc:h2:mem:tripmind_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.data.redis.repositories.enabled=false
tripmind.redis.agent-bus.enabled=false
tripmind.redis.events.enabled=false
tripmind.weather.provider=disabled
tripmind.places.geoapify.api-key=
tripmind.places.opentripmap.api-key=
tripmind.ai.groq.api-key=
tripmind.ai.openai.api-key=
tripmind.ai.provider=rule_based
spring.ai.model.chat=none
spring.ai.mcp.server.enabled=false
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

