server.port=${PORT:8080}
spring.application.name=tripmind
spring.data.redis.repositories.enabled=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.password=
spring.datasource.url=jdbc:h2:file:./data/tripmind;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
tripmind.ai.groq.api-key=${GROQ_API_KEY:}
tripmind.ai.groq.model=llama-3.3-70b-versatile
tripmind.ai.openai.api-key=${OPENAI_API_KEY:}
tripmind.ai.openai.model=gpt-5.1
tripmind.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
tripmind.ai.openrouter.model=openrouter/free
tripmind.ai.provider=${TRIPMIND_AI_PROVIDER:rule_based}
tripmind.ai.xai.api-key=${XAI_API_KEY:}
tripmind.ai.xai.model=grok-4.20-reasoning
tripmind.places.geoapify.api-key=${GEOAPIFY_API_KEY:}
tripmind.places.opentripmap.api-key=${OPENTRIPMAP_API_KEY:}
tripmind.places.provider=${TRIPMIND_PLACES_PROVIDER:hybrid}
tripmind.redis.agent-bus.enabled=true
tripmind.redis.agent-bus.result-prefix=tripmind.agent
tripmind.redis.agent-bus.task-prefix=tripmind.agent
tripmind.redis.events.enabled=true
tripmind.redis.events.stream=tripmind.workflow.events
tripmind.planning.executor.core-size=${TRIPMIND_PLANNING_CORE_THREADS:4}
tripmind.planning.executor.max-size=${TRIPMIND_PLANNING_MAX_THREADS:8}
tripmind.planning.executor.queue-capacity=${TRIPMIND_PLANNING_QUEUE_CAPACITY:100}
tripmind.http.connect-timeout-seconds=${TRIPMIND_HTTP_CONNECT_TIMEOUT_SECONDS:3}
tripmind.http.read-timeout-seconds=${TRIPMIND_HTTP_READ_TIMEOUT_SECONDS:8}
tripmind.weather.openweather.api-key=${OPENWEATHER_API_KEY:}
tripmind.weather.provider=${TRIPMIND_WEATHER_PROVIDER:openweather}
