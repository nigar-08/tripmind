# Local demonstration profile. Remote use requires authentication and plan ownership checks.
server.address=127.0.0.1
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=tripmind
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stateless.mcp-endpoint=/mcp
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=Use saved plan UUIDs supplied by the user. Tools are read-only. Costs are heuristic estimates, not live quotes. Tourism guidance is a curated snapshot. Preserve traveler needs; users apply revisions in the TripMind UI.
