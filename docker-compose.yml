services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripmind-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/tripmind;MODE=PostgreSQL;AUTO_SERVER=FALSE
    volumes:
      - ./docker-data/app:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tripmind-redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
